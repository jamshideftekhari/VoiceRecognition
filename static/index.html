<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order</title>
<style>
  :root {
    --bg: #f6f2ec; --panel: #ffffff; --text: #2b2420; --muted: #7a6f66; --line: #e6ddd2;
    --accent: #b5532c; --accent-text: #ffffff; --waiter: #f1ebe3; --customer: #b5532c; --customer-text: #ffffff;
    --ok: #2f7d4f; --error: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1916; --panel: #26221e; --text: #f1ebe3; --muted: #a89c91; --line: #3a342e;
      --accent: #e07a4f; --accent-text: #1c1916; --waiter: #332d28; --customer: #e07a4f; --customer-text: #1c1916;
      --ok: #6cc28f; --error: #f2857b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.01em; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 0.95rem; margin-left: 0.4rem; }
  button { font: inherit; cursor: pointer; border-radius: 0.6rem; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0.5rem 0.9rem; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1rem; max-width: 1100px; margin: 0 auto; padding: 1rem; height: calc(100dvh - 62px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; }

  #chat { display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .msg { max-width: 80%; padding: 0.6rem 0.9rem; border-radius: 1rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.waiter { align-self: flex-start; background: var(--waiter); border-bottom-left-radius: 0.3rem; }
  .msg.customer { align-self: flex-end; background: var(--customer); color: var(--customer-text); border-bottom-right-radius: 0.3rem; }
  .msg.note { align-self: center; background: none; color: var(--error); font-size: 0.9rem; text-align: center; }
  .typing { align-self: flex-start; color: var(--muted); font-style: italic; padding: 0 0.4rem; }
  form { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid var(--line); }
  form input { flex: 1; min-width: 0; font: inherit; padding: 0.6rem 0.8rem; border-radius: 0.6rem; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  aside { display: flex; flex-direction: column; gap: 1rem; min-height: 0; overflow-y: auto; }
  aside section { padding: 1rem; }
  aside h2 { margin: 0 0 0.6rem; font-size: 1rem; }
  #order-lines { list-style: none; margin: 0; padding: 0; }
  #order-lines li { display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px dashed var(--line); }
  #order-lines .notes { display: block; color: var(--muted); font-size: 0.85rem; }
  #order-lines .price, .total .price { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); margin: 0; }
  .total { display: flex; justify-content: space-between; margin-top: 0.6rem; font-weight: 700; }
  #placed { margin-top: 0.75rem; padding: 0.6rem 0.8rem; border-radius: 0.6rem; background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); font-weight: 600; }
  .menu-category { margin: 0.8rem 0 0.3rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .menu-item { display: flex; justify-content: space-between; gap: 0.75rem; width: 100%; text-align: left; border: none; background: none; padding: 0.35rem 0.4rem; border-radius: 0.4rem; }
  .menu-item:hover { background: var(--waiter); }
  .menu-item small { display: block; color: var(--muted); }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 0; }

  /* "How the computer sees it": UTF-8 bytes per character, shown when body has .show-hex */
  :root { --b1: #e8eef7; --b2: #fde7c8; --b3: #e3f2dc; --b4: #f6dcef; --b-text: #2b2420; }
  @media (prefers-color-scheme: dark) {
    :root { --b1: #2c3542; --b2: #4a3a22; --b3: #2b3d27; --b4: #45293d; --b-text: #f1ebe3; }
  }
  .header-tools { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .switch { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; }
  .switch input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  .bytes, #hex-preview, .legend { display: none; }
  .show-hex .bytes, .show-hex #hex-preview, .show-hex .legend { display: block; }
  .bytes { margin-top: 0.35rem; }
  .msg .bytes { padding: 0.4rem; border-radius: 0.6rem; background: var(--panel); color: var(--text); }
  .chars { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .ch { display: flex; flex-direction: column; align-items: center; padding: 0.15rem 0.3rem; border-radius: 0.35rem; color: var(--b-text);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.8rem; line-height: 1.25; cursor: help; }
  .ch .glyph { font-size: 1rem; font-weight: 600; }
  .ch.n1 { background: var(--b1); } .ch.n2 { background: var(--b2); } .ch.n3 { background: var(--b3); } .ch.n4 { background: var(--b4); }
  .count { margin-top: 0.3rem; font-size: 0.8rem; color: var(--muted); }
  #hex-preview { padding: 0.6rem 0.75rem 0; max-height: 30dvh; overflow-y: auto; }
  #hex-preview .empty { font-size: 0.85rem; }
  .legend { padding: 0.5rem 1rem 0; font-size: 0.8rem; color: var(--muted); }
  .legend .ch { display: inline-flex; flex-direction: row; gap: 0.3rem; margin: 0.1rem 0.2rem 0.1rem 0; cursor: default; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    #chat { height: 70dvh; }
    aside { overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <h1 id="restaurant">Restaurant<span>Order with our AI waiter</span></h1>
  <div class="header-tools">
    <label class="switch"><input id="hex-toggle" type="checkbox"> Show bytes (hex)</label>
    <button id="new-order" type="button">New order</button>
  </div>
</header>
<main>
  <div id="chat" class="card">
    <div class="legend">
      UTF-8 bytes per character:
      <span class="ch n1">a = 1 byte</span><span class="ch n2">æ ø å = 2 bytes</span><span class="ch n3">€ = 3 bytes</span><span class="ch n4">😀 = 4 bytes</span>
      · Hover a character for its Unicode number and binary.
    </div>
    <div id="messages" aria-live="polite"></div>
    <div id="hex-preview" aria-live="polite"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type your order, e.g. two margheritas and a beer" maxlength="1000" aria-label="Message">
      <button id="send" class="primary" type="submit">Send</button>
    </form>
  </div>
  <aside>
    <section class="card">
      <h2>Your order</h2>
      <ul id="order-lines"></ul>
      <p id="order-empty" class="empty">Nothing ordered yet.</p>
      <div class="total" id="order-total" hidden><span>Total</span><span class="price"></span></div>
      <div id="placed" hidden></div>
    </section>
    <section class="card">
      <h2>Menu</h2>
      <p class="hint">Click a dish to add its name to your message.</p>
      <div id="menu"></div>
    </section>
  </aside>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let sessionId = null;
  let currency = "DKK";
  let busy = false;

  // ---- How the computer sees the text: each character and its UTF-8 bytes ----
  const encoder = new TextEncoder();  // text -> UTF-8 bytes
  const hex = (b) => "0x" + b.toString(16).toUpperCase().padStart(2, "0");  // 0x marks a hexadecimal number
  const bin = (b) => b.toString(2).padStart(8, "0");

  function renderBytes(text) {
    const box = document.createElement("div");
    box.className = "bytes";
    const chars = document.createElement("div");
    chars.className = "chars";
    let charCount = 0, byteCount = 0;
    for (const ch of text) {  // for..of walks Unicode characters (code points), not UTF-16 units
      const bytes = encoder.encode(ch);
      charCount += 1;
      byteCount += bytes.length;
      const codePoint = "U+" + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, "0");
      const chip = document.createElement("span");
      chip.className = "ch n" + bytes.length;
      chip.title = `${codePoint} · ${bytes.length} byte${bytes.length > 1 ? "s" : ""} · binary ${[...bytes].map(bin).join(" ")}`;
      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.textContent = ch === " " ? "␣" : ch;  // make spaces visible
      const code = document.createElement("span");
      code.textContent = [...bytes].map(hex).join(" ");
      chip.append(glyph, code);
      chars.appendChild(chip);
    }
    const count = document.createElement("div");
    count.className = "count";
    count.textContent = `${charCount} character${charCount === 1 ? "" : "s"} → ${byteCount} byte${byteCount === 1 ? "" : "s"} (UTF-8)`;
    box.append(chars, count);
    return box;
  }

  function updatePreview() {
    const preview = $("hex-preview");
    const text = $("input").value;
    if (text) {
      preview.replaceChildren(renderBytes(text));
    } else {
      const hint = document.createElement("p");
      hint.className = "empty";
      hint.textContent = "Start typing to see how the computer stores each character.";
      preview.replaceChildren(hint);
    }
  }

  function setHex(on) {
    document.body.classList.toggle("show-hex", on);
    $("hex-toggle").checked = on;
    try { localStorage.setItem("showHex", on ? "1" : "0"); } catch (e) {}
    updatePreview();
  }

  function addMessage(kind, text) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    if (kind !== "note") div.appendChild(renderBytes(text));
    $("messages").appendChild(div);
    div.scrollIntoView({ block: "end" });
  }

  function setTyping(on) {
    const existing = document.querySelector(".typing");
    if (on && !existing) {
      const div = document.createElement("div");
      div.className = "typing";
      div.textContent = "The waiter is typing…";
      $("messages").appendChild(div);
      div.scrollIntoView({ block: "end" });
    } else if (!on && existing) {
      existing.remove();
    }
  }

  function setBusy(on, done = false) {
    busy = on;
    $("send").disabled = on || done;
    $("input").disabled = done;
    $("input").placeholder = done ? "Order placed. Click “New order” to order again." : "Type your order, e.g. two margheritas and a beer";
  }

  function renderOrder(order) {
    const list = $("order-lines");
    list.replaceChildren();
    for (const line of order.lines) {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.textContent = `${line.quantity} × ${line.name}`;
      if (line.notes) {
        const notes = document.createElement("span");
        notes.className = "notes";
        notes.textContent = line.notes;
        name.appendChild(notes);
      }
      const price = document.createElement("span");
      price.className = "price";
      price.textContent = `${line.line_total} ${order.currency}`;
      li.append(name, price);
      list.appendChild(li);
    }
    $("order-empty").hidden = order.lines.length > 0;
    $("order-total").hidden = order.lines.length === 0;
    $("order-total").querySelector(".price").textContent = `${order.total} ${order.currency}`;
    $("placed").hidden = !order.placed_as;
    $("placed").textContent = order.placed_as ? `✓ Order placed — number ${order.placed_as}` : "";
  }

  function renderMenu(items) {
    const menu = $("menu");
    menu.replaceChildren();
    let category = null;
    for (const item of items) {
      if (item.category !== category) {
        category = item.category;
        const h = document.createElement("div");
        h.className = "menu-category";
        h.textContent = category;
        menu.appendChild(h);
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "menu-item";
      const name = document.createElement("span");
      name.textContent = item.name;
      const description = document.createElement("small");
      description.textContent = item.description;
      name.appendChild(description);
      const price = document.createElement("span");
      price.textContent = `${item.price} ${currency}`;
      button.append(name, price);
      button.addEventListener("click", () => {
        const input = $("input");
        input.value = input.value.trim() ? `${input.value.trim()}, ${item.name}` : item.name;
        updatePreview();
        input.focus();
      });
      menu.appendChild(button);
    }
  }

  async function post(url, body) {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Something went wrong. Please try again.");
    return data;
  }

  async function newOrder() {
    $("messages").replaceChildren();
    setBusy(true);
    try {
      const data = await post("/api/session");
      sessionId = data.session_id;
      currency = data.currency;
      document.title = `Order · ${data.restaurant}`;
      $("restaurant").firstChild.textContent = data.restaurant;
      renderMenu(data.menu);
      renderOrder(data.order);
      addMessage("waiter", data.greeting);
      setBusy(false);
      $("input").focus();
    } catch (error) {
      addMessage("note", error.message);
      setBusy(false, true);
    }
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = $("input").value.trim();
    if (!text || busy || !sessionId) return;
    $("input").value = "";
    updatePreview();
    addMessage("customer", text);
    setBusy(true);
    setTyping(true);
    let done = false;
    try {
      const data = await post("/api/chat", { session_id: sessionId, text });
      if (data.reply) addMessage("waiter", data.reply);
      renderOrder(data.order);
      done = data.done;
    } catch (error) {
      addMessage("note", error.message);
    } finally {
      setTyping(false);
      setBusy(false, done);
      if (!done) $("input").focus();
    }
  });

  $("new-order").addEventListener("click", newOrder);
  $("input").addEventListener("input", updatePreview);
  $("hex-toggle").addEventListener("change", (event) => setHex(event.target.checked));
  let savedHex = false;
  try { savedHex = localStorage.getItem("showHex") === "1"; } catch (e) {}
  setHex(savedHex);
  newOrder();
</script>
</body>
</html>
